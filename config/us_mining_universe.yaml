# Phase-1 pilot universe: US-listed mining (coal, copper, precious/base metals).
# Used for SEC Item 1.03 (bankruptcy/receivership) collection — not a full GICS universe.
#
# ticker: Yahoo / EDGAR trading symbol when resolvable
# cik: optional zero-padded or int CIK when ticker is stale (e.g. post-merger)
# commodities: free tags for later cost-curve slicing
# manual_reorg: curated successor notes when Item 1.03 is on a prior entity only

description: >
  US mining pilot for (1) bankruptcy-cleaned survivor via 8-K Item 1.03,
  (2) reserve life via 10-K S-K 1300 narrative / Exhibit 96 flags, and
  (3) reported unit costs ranked within pilot peer cohorts (not WoodMac).
  Prefer CIK when the post-reorg ticker no longer resolves in EDGAR.

companies:
