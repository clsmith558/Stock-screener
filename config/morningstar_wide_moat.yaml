# Morningstar wide-moat list — public-source proxy for the screener Lists dropdown.
#
# This is NOT Morningstar's complete live Wide Economic Moat universe.
# Morningstar reported 169 US-listed wide-moat stocks after its March 2026 review;
# the full screen is behind Morningstar Investor.
#
# The refresh script unions:
#   1) Best Companies to Own (official public CSVs) — Wide moat PLUS
#      Standard/Exemplary capital allocation AND Low/Medium fair-value uncertainty
#   2) A public compilation of 98 selected US-listed names (Aug 2026)
#   3) VanEck MOAT ETF holdings when scrapeable (Wide Moat Focus Index —
#      the cheapest ~50 wide-moat names, not the full universe)

