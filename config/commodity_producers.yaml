# Commodity strips (from your Barchart daily CSV) + mining-pilot producers.
# Override path with env COMMODITY_DATA_CSV.

csv_path: "C:/Python scripts/Commodity data collection/daily_commodity_price_data.csv"

# How stale before UI warns (calendar days)
stale_after_days: 5

# Ratio z-score lookback (trading days); falls back to full sample if shorter
ratio_z_lookback: 90

# Flags
undervalued_ratio_z_max: -1.0
undervalued_min_margin_pct: 15.0

commodities:
  coking_coal:
    csv_name: "coking coal"
    unit: "USD/t"
    display: "Coking coal"
  thermal_coal:
    csv_name: "thermal coal"
    unit: "USD/t"
    display: "Thermal coal"
  iron_ore:
    csv_name: "iron ore"
    unit: "USD/t"
    display: "Iron ore 62% Fe"
    plausible_min: 20
    plausible_max: 250
    notes: >
      Strip is SGX TSI / IMF 62% Fe CFR USD/t. The Barchart daily CSV
      "iron ore" row was Tokyo Topix-Mini (TS*0, ~4000) — ignored.
  aluminum:
    csv_name: "aluminum"
    unit: "USD/t"
    display: "Aluminum"
  copper:
    csv_name: "copper"
    unit: "USD/lb"
    display: "Copper"
  silver:
    csv_name: "silver"
    unit: "USD/oz"
    display: "Silver"
  gold:
    csv_name: "gold"
    unit: "USD/oz"
    display: "Gold"
  crude_oil_wti:
    csv_name: "crude oil WTI"
    unit: "USD/bbl"
    display: "Crude oil WTI"
  crude_oil_brent:
    csv_name: "crude oil brent"
    unit: "USD/bbl"
    display: "Crude oil Brent"
  platinum:
    csv_name: "platinum"
    unit: "USD/oz"
    display: "Platinum"
  palladium:
    csv_name: "palladium"
    unit: "USD/oz"
    display: "Palladium"
  steel_scrap:
    csv_name: "steel scrap"
    unit: "USD/t"
    display: "Steel scrap"
  steel_rebar:
    csv_name: "steel rebar"
    unit: "USD/t"
    display: "Steel rebar"
  uranium_u3o8:
    display: Uranium U3O8
    unit: USD/lb
    notes: Official monthly FRED via supporting_series.db
  henry_hub:
    display: Henry Hub natural gas
    unit: USD/MMBtu
    notes: Official daily FRED/EIA via supporting_series.db
  lithium_carbonate:
    display: Lithium carbonate
    unit: USD/t
    notes: >
      No honest public daily. Monthly World Bank Pink Sheet when the column
      exists (supporting_series.db). Spodumene FOB costs are USD/t SC6, not LCE.

# Producers shown on the Commodities tab. Filter options = union of `primary`
# + `commodities`. Unit costs only when cost_source cache exists.
producers:
