  # --- iron ore ---
  - ticker: BHP
    name: BHP
    commodities: [iron_ore, copper]
    primary: iron_ore
  - ticker: RIO
    name: Rio Tinto
    commodities: [iron_ore, copper, aluminum]
    primary: iron_ore
  - ticker: VALE
    name: Vale
    commodities: [iron_ore, copper]
    primary: iron_ore
    cost_source: us_mining
    notes: >
      C1 cash cost of iron ore fines, FOB, excluding third-party purchases (USD/t).
      Not all-in CFR China. Strip is typically 62% Fe CFR — margin is indicative.
  - ticker: FMG.AX
    name: Fortescue
    commodities: [iron_ore]
    primary: iron_ore
    cost_source: asx_mining
    notes: >
      Hematite C1 unit cost (USD/wmt), excluding Iron Bridge magnetite.
      Wet tonnes vs dry 62% Fe CFR strip — margin is indicative.
    cost_history_pdfs:
      - period_end: "2026-06-30"
        url: "https://cdn-api.markitdigital.com/apiman-gateway/ASX/asx-research/1.0/file/2924-03116249-6A1336475"
        label: Q4 FY26 Quarterly Production Report
      - period_end: "2026-03-31"
        url: "https://announcements.asx.com.au/asxpdf/20260424/pdf/06ytclmh4bwzlr.pdf"
        label: Q3 FY26 Quarterly Production Report
      - period_end: "2025-12-31"
        url: "https://cdn-api.markitdigital.com/apiman-gateway/ASX/asx-research/1.0/file/2924-03048082-6A1307990"
        label: Q2 FY26 Quarterly Production Report
  - ticker: MIN.AX
    name: Mineral Resources
    commodities: [iron_ore, lithium_carbonate]
    primary: iron_ore
    cost_source: asx_mining
    notes: >
      Not a group pure-play (Onslow Iron + lithium + mining services).
      Unit cost is Onslow Iron FOB $/wmt (AUD unless US$ stated).
  - ticker: CIA.AX
    name: Champion Iron
    commodities: [iron_ore]
    primary: iron_ore
    cost_source: asx_mining
    notes: >
      Bloom Lake C1 cash cost loaded onto vessels, USD/dmt (CAD also disclosed).
      Higher than Pilbara hematite C1 because it includes rail/port.
  - ticker: CLF
    name: Cleveland-Cliffs
    commodities: [iron_ore, steel_scrap]
    primary: iron_ore
    cost_source: us_mining

