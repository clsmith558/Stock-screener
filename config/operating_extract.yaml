# Phase 2 — quarterly operating extracts from filings.
# Seed list only. Heuristic regex; always verify snippet vs the source.
#
# Collector: scripts/collect_operating_extract.py
# Store: asx_announcements_cache.db → operating_extract

version: 1
status: phase2

# Default lookback when pulling SEC / ASX docs
max_10q: 6
max_10k: 2
max_8k: 8

seed:
  - ticker: OXY
    name: Occidental Petroleum
    market: us
    fields: [production, realized_price, hedge_pct, capex]
    production: {unit: mboe/d, commodity: oil}
    realized: {unit: USD/bbl, commodity: oil}
    hedge: {unit: pct}
    capex: {unit: USD}

  - ticker: EQT
    name: EQT
    market: us
    fields: [production, realized_price, hedge_pct, capex]
